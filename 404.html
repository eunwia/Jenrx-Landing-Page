<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Jenrx</title>
  <meta name="description" content="Page not found. Return to Jenrx personal health tracking companion.">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--bg-page);
      text-align: center;
    }
    .not-found-card {
      max-width: 520px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 3rem 2rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .not-found-logo {
      height: 48px;
      margin-bottom: 2rem;
      object-fit: contain;
    }
    .not-found-mascot {
      width: 120px;
      height: auto;
      margin-bottom: 1.5rem;
      border-radius: 50%;
      background: var(--blue-subtle);
      padding: 0.75rem;
    }
    .not-found-code {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--blue-primary);
      line-height: 1;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
    }
    .not-found-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    .not-found-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <main class="not-found-wrapper">
    <div class="not-found-card">
      <a href="/" aria-label="Jenrx Home">
        <img src="images/logo_text.png" alt="Jenrx Logo" class="not-found-logo">
      </a>
      <img src="images/logo.png" alt="Jenrx Mascot" class="not-found-mascot">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">The page you are looking for doesn't exist or has been moved. Let's get you back to safety.</p>
      <div class="not-found-actions">
        <a href="/" class="btn btn-primary btn-lg" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Back to Home</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
